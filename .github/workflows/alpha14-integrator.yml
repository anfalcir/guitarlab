name: Alpha14 integrator

on:
  push:
    branches:
      - dev/parallel-m3-m5

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'ci: trigger alpha14 integrator'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Apply, validate and promote alpha14
        run: bash scripts/run_alpha14_payload.sh
