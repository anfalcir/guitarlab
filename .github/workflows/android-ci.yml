name: GuitarLab Android CI

on:
  push:
    branches: [ main, dev/parallel-m3-m5 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      signed_homologation:
        description: "Build signed homologation APK"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guitarlab-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  EXPECTED_CERT_SHA256: "0762D4F3ECB8E1A9AAA4BDB1E098A666C9BA9BF8B71C4F14B0E7A7065404E181"

jobs:
  software-gate:
    name: Unit tests + Lint + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Diff sanity
        shell: bash
        run: git diff --check HEAD^ --

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 9.6.1 and persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Read app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          gradle --no-daemon --console=plain --stacktrace test 2>&1 | tee ci-diagnostics/unit-tests.log
          STATUS=${PIPESTATUS[0]}
          tail -n 250 ci-diagnostics/unit-tests.log > ci-diagnostics/unit-tests-tail.log
          exit $STATUS

      - name: Android Lint
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          gradle --no-daemon --console=plain --stacktrace lint 2>&1 | tee ci-diagnostics/lint.log
          STATUS=${PIPESTATUS[0]}
          tail -n 250 ci-diagnostics/lint.log > ci-diagnostics/lint-tail.log
          exit $STATUS

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          gradle --no-daemon --console=plain --stacktrace assembleDebug 2>&1 | tee ci-diagnostics/assemble-debug.log
          STATUS=${PIPESTATUS[0]}
          tail -n 250 ci-diagnostics/assemble-debug.log > ci-diagnostics/assemble-debug-tail.log
          exit $STATUS

      - name: Upload debug APK, reports and CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-${{ env.APP_VERSION_NAME }}-software-gate
          if-no-files-found: warn
          retention-days: 30
          path: |
            ci-diagnostics/**
            app/build/outputs/apk/debug/*.apk
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml

  homologation-apk:
    name: Signed homologation APK
    needs: software-gate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.signed_homologation == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[sign-homologation]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 9.6.1 and persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Read app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore private signing bundle
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.GUITARLAB_SIGNING_BUNDLE_B64 }}
        run: |
          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "::error::Missing repository secret GUITARLAB_SIGNING_BUNDLE_B64"
            exit 1
          fi
          umask 077
          SIGN_DIR="$RUNNER_TEMP/guitarlab-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > "$SIGN_DIR/signing.zip"
          unzip -q "$SIGN_DIR/signing.zip" -d "$SIGN_DIR/unpacked"
          KEYSTORE="$SIGN_DIR/unpacked/guitarlab-homologation.jks"
          CREDS="$SIGN_DIR/unpacked/guitarlab-homologation-credentials.txt"
          test -s "$KEYSTORE"
          test -s "$CREDS"
          ALIAS="$(awk -F= '$1=="alias" {sub(/^alias=/,""); print; exit}' "$CREDS")"
          PASSWORD="$(awk -F= '$1=="password" {sub(/^password=/,""); print; exit}' "$CREDS")"
          test -n "$ALIAS"
          test -n "$PASSWORD"
          echo "::add-mask::$PASSWORD"
          {
            echo "GUITARLAB_KEYSTORE_PATH=$KEYSTORE"
            echo "GUITARLAB_KEY_ALIAS=$ALIAS"
            echo "GUITARLAB_KEYSTORE_PASSWORD=$PASSWORD"
            echo "GUITARLAB_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace assembleRelease

      - name: Verify official signing identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $ACTUAL"
            exit 1
          fi

      - name: Package homologation deliverable
        shell: bash
        run: |
          mkdir -p deliverables
          APK_NAME="GuitarLabStudio-${APP_VERSION_NAME}-homologacao.apk"
          cp app/build/outputs/apk/release/app-release.apk "deliverables/${APK_NAME}"
          sha256sum deliverables/*.apk > deliverables/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "versionName=${APP_VERSION_NAME}"
            echo "versionCode=${APP_VERSION_CODE}"
            echo "milestone=M7-physical-homologation-candidate"
            echo "gate=alpha1-awaiting-physical-validation"
            echo "hardwareBaseline=M6-alpha1-physical-pass"
            echo "certificateSha256=${EXPECTED_CERT_SHA256}"
          } > deliverables/BUILD_IDENTITY.txt

      - name: Upload signed homologation APK
        uses: actions/upload-artifact@v4
        with:
          name: GuitarLabStudio-${{ env.APP_VERSION_NAME }}-homologacao
          if-no-files-found: error
          retention-days: 90
          path: deliverables/

      - name: Destroy restored keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/guitarlab-signing"
