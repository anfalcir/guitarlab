name: GuitarLab Android CI

on:
  workflow_dispatch:
    inputs:
      signed_homologation:
        description: "Build signed homologation APK"
        required: true
        type: boolean
        default: false
  # One-shot CI trigger for the H33a corrective. Remove after the run is closed.
  push:
    branches:
      - main
    paths:
      - ".source-parts/H33aExternalControlCiCorrective.patch.gz.b64"

permissions:
  contents: read

concurrency:
  group: guitarlab-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  EXPECTED_PACKAGE_NAME: "studio.guitarlab.app"
  EXPECTED_CERT_SHA256: "4B82890A9812BB89E1BBEF179A48752BDA2CA8AB284C833DAA27A907F4CE5E89"

jobs:
  software-gate:
    name: Unit tests + Lint + APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Diff sanity
        shell: bash
        run: git diff --check HEAD^ --

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install build-only SDK packages
        shell: bash
        run: |
          chmod +x scripts/ci_install_sdk_packages.sh
          scripts/ci_install_sdk_packages.sh \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 9.6.1 and persistent cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guitarlab-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            .github/
            .source-parts/
            app/src/
            app/build.gradle.kts
            core/
            platform/
            scripts/
            docs/
            README.md
            .gitignore
            build.gradle.kts
            gradle.properties
            gradle/
            settings.gradle.kts

      - name: Read and validate app identity
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          PACKAGE_NAME="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test -n "$PACKAGE_NAME"
          if [ "$PACKAGE_NAME" != "$EXPECTED_PACKAGE_NAME" ]; then
            echo "::error::Package mismatch in build config. Expected $EXPECTED_PACKAGE_NAME, got $PACKAGE_NAME"
            exit 1
          fi
          {
            echo "APP_VERSION_NAME=$VERSION_NAME"
            echo "APP_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          gradle --console=plain --stacktrace test 2>&1 | tee ci-diagnostics/unit-tests.log
          STATUS=${PIPESTATUS[0]}
          tail -n 250 ci-diagnostics/unit-tests.log > ci-diagnostics/unit-tests-tail.log
          exit $STATUS

      - name: Collect reproducible performance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          : > ci-diagnostics/performance-evidence.txt
          find . -type f -path '*/build/test-results/test/*.xml' -print0 \
            | xargs -0 -r grep -hoE 'GUITARLAB_(RENDER_)?PERF\|[^<]+' \
            | sort -u \
            | tee ci-diagnostics/performance-evidence.txt

      - name: Android Lint
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          gradle --console=plain --stacktrace lint 2>&1 | tee ci-diagnostics/lint.log
          STATUS=${PIPESTATUS[0]}
          tail -n 250 ci-diagnostics/lint.log > ci-diagnostics/lint-tail.log
          exit $STATUS

      - name: Assemble debug and release candidate
        shell: bash
        env:
          BUILD_SIGNED_HOMOLOGATION: ${{ github.event_name == 'push' || inputs.signed_homologation }}
        run: |
          set +e
          mkdir -p ci-diagnostics
          if [ "$BUILD_SIGNED_HOMOLOGATION" = "true" ]; then
            gradle --console=plain --stacktrace assembleDebug assembleRelease 2>&1 | tee ci-diagnostics/assemble-apks.log
          else
            gradle --console=plain --stacktrace assembleDebug 2>&1 | tee ci-diagnostics/assemble-apks.log
          fi
          STATUS=${PIPESTATUS[0]}
          tail -n 250 ci-diagnostics/assemble-apks.log > ci-diagnostics/assemble-apks-tail.log
          exit $STATUS

      - name: Validate and stage unsigned release candidate
        if: ${{ github.event_name == 'push' || inputs.signed_homologation == true }}
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK"

          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          if "$APKSIGNER" verify "$UNSIGNED_APK" >/dev/null 2>&1; then
            echo "::error::Release candidate must be unsigned before crossing the job boundary"
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$UNSIGNED_APK")"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          ACTUAL_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          ACTUAL_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p" | head -n1)"
          test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE_NAME"
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_NAME" = "$APP_VERSION_NAME"

          mkdir -p release-candidate
          cp "$UNSIGNED_APK" release-candidate/app-release-unsigned.apk
          (
            cd release-candidate
            sha256sum app-release-unsigned.apk > UNSIGNED_SHA256SUMS.txt
          )
          {
            echo "sourceSha=${GITHUB_SHA}"
            echo "packageName=${EXPECTED_PACKAGE_NAME}"
            echo "versionName=${APP_VERSION_NAME}"
            echo "versionCode=${APP_VERSION_CODE}"
          } > release-candidate/RELEASE_BUILD_IDENTITY.txt

      - name: Upload unsigned release candidate
        if: ${{ github.event_name == 'push' || inputs.signed_homologation == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guitarlab-release-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: release-candidate/

      - name: Upload debug APK, reports and CI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guitarlab-${{ env.APP_VERSION_NAME }}-software-gate
          if-no-files-found: warn
          retention-days: 30
          path: |
            ci-diagnostics/**
            app/build/outputs/apk/debug/*.apk
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml

  android-integration-gate:
    name: API 36 emulator regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Diff sanity
        shell: bash
        run: git diff --check HEAD^ --

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install API 36 emulator SDK packages
        shell: bash
        run: |
          chmod +x scripts/ci_install_sdk_packages.sh
          scripts/ci_install_sdk_packages.sh \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "emulator" \
            "system-images;android-${ANDROID_PLATFORM};default;x86_64"

      - name: Set up Gradle 9.6.1 and read-only cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-read-only: true
          cache-cleanup: never

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore API 36 AVD snapshot cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: guitarlab-avd-v1-api36-default-x86_64-pixel7

      - name: Create API 36 AVD snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: guitarlab-api36
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: false
          emulator-boot-timeout: 600
          script: echo "Generated clean API 36 AVD snapshot for CI cache."

      - name: Run API 36 instrumented regression
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: guitarlab-api36
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            gradle --console=plain --stacktrace connectedDebugAndroidTest
            mkdir -p ci-diagnostics/android-default
            cp -R app/build/outputs/androidTest-results/connected ci-diagnostics/android-default/results
            cp -R app/build/reports/androidTests/connected ci-diagnostics/android-default/reports

            adb shell wm size 1920x1200
            adb shell wm density 240
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell am force-stop studio.guitarlab.app || true

            gradle --console=plain --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=studio.guitarlab.app.TargetTabletGeometryInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.targetGeometry=true

            mkdir -p ci-diagnostics/tablet-geometry
            cp -R app/build/outputs/androidTest-results/connected ci-diagnostics/tablet-geometry/results
            cp -R app/build/reports/androidTests/connected ci-diagnostics/tablet-geometry/reports

      - name: Upload Android integration reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guitarlab-${{ github.sha }}-android-integration
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
            ci-diagnostics/android-default/**
            ci-diagnostics/tablet-geometry/**

  homologation-apk:
    name: Signed homologation APK
    needs: [software-gate, android-integration-gate]
    if: ${{ github.event_name == 'push' || inputs.signed_homologation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install signing SDK package
        shell: bash
        run: |
          chmod +x scripts/ci_install_sdk_packages.sh
          scripts/ci_install_sdk_packages.sh "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download tested unsigned release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: guitarlab-release-unsigned-${{ github.sha }}
          path: release-candidate

      - name: Verify release candidate provenance and identity
        shell: bash
        run: |
          set -euo pipefail
          test -f release-candidate/app-release-unsigned.apk
          test -f release-candidate/UNSIGNED_SHA256SUMS.txt
          test -f release-candidate/RELEASE_BUILD_IDENTITY.txt

          (
            cd release-candidate
            sha256sum --check UNSIGNED_SHA256SUMS.txt
          )

          SOURCE_SHA="$(sed -n 's/^sourceSha=//p' release-candidate/RELEASE_BUILD_IDENTITY.txt | head -n1)"
          ARTIFACT_PACKAGE="$(sed -n 's/^packageName=//p' release-candidate/RELEASE_BUILD_IDENTITY.txt | head -n1)"
          ARTIFACT_VERSION_NAME="$(sed -n 's/^versionName=//p' release-candidate/RELEASE_BUILD_IDENTITY.txt | head -n1)"
          ARTIFACT_VERSION_CODE="$(sed -n 's/^versionCode=//p' release-candidate/RELEASE_BUILD_IDENTITY.txt | head -n1)"

          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          PACKAGE_NAME="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"

          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$ARTIFACT_PACKAGE" = "$EXPECTED_PACKAGE_NAME"
          test "$ARTIFACT_PACKAGE" = "$PACKAGE_NAME"
          test "$ARTIFACT_VERSION_NAME" = "$VERSION_NAME"
          test "$ARTIFACT_VERSION_CODE" = "$VERSION_CODE"

          {
            echo "APP_VERSION_NAME=$VERSION_NAME"
            echo "APP_VERSION_CODE=$VERSION_CODE"
            echo "UNSIGNED_APK_SHA256=$(sha256sum release-candidate/app-release-unsigned.apk | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Restore private signing bundle
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.GUITARLAB_SIGNING_BUNDLE_B64 }}
        run: |
          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "::error::Missing repository secret GUITARLAB_SIGNING_BUNDLE_B64"
            exit 1
          fi
          umask 077
          SIGN_DIR="$RUNNER_TEMP/guitarlab-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$SIGNING_BUNDLE_B64" | base64 --decode > "$SIGN_DIR/signing.zip"
          unzip -q "$SIGN_DIR/signing.zip" -d "$SIGN_DIR/unpacked"
          KEYSTORE="$SIGN_DIR/unpacked/guitarlab-homologation.jks"
          CREDS="$SIGN_DIR/unpacked/guitarlab-homologation-credentials.txt"
          test -s "$KEYSTORE"
          test -s "$CREDS"
          ALIAS="$(awk -F= '$1=="alias" {sub(/^alias=/,""); print; exit}' "$CREDS")"
          PASSWORD="$(awk -F= '$1=="password" {sub(/^password=/,""); print; exit}' "$CREDS")"
          test -n "$ALIAS"
          test -n "$PASSWORD"
          echo "::add-mask::$PASSWORD"
          {
            echo "GUITARLAB_KEYSTORE_PATH=$KEYSTORE"
            echo "GUITARLAB_KEY_ALIAS=$ALIAS"
            echo "GUITARLAB_KEYSTORE_PASSWORD=$PASSWORD"
            echo "GUITARLAB_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Align and sign tested release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          ZIPALIGN="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          INPUT_APK="release-candidate/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/guitarlab-release-aligned.apk"
          SIGNED_APK="deliverables/GuitarLabStudio-${APP_VERSION_NAME}-homologacao.apk"

          "$ZIPALIGN" -P 16 -f -v 4 "$INPUT_APK" "$ALIGNED_APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$GUITARLAB_KEYSTORE_PATH" \
            --ks-key-alias "$GUITARLAB_KEY_ALIAS" \
            --ks-pass env:GUITARLAB_KEYSTORE_PASSWORD \
            --key-pass env:GUITARLAB_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

      - name: Verify signed APK, certificate and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK="deliverables/GuitarLabStudio-${APP_VERSION_NAME}-homologacao.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"

          test -f "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"

          ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $ACTUAL_CERT"
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$APK")"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          ACTUAL_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          ACTUAL_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p" | head -n1)"

          test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE_NAME"
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_NAME" = "$APP_VERSION_NAME"

      - name: Package homologation identity
        shell: bash
        run: |
          set -euo pipefail
          APK="deliverables/GuitarLabStudio-${APP_VERSION_NAME}-homologacao.apk"
          SIGNED_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          (
            cd deliverables
            sha256sum *.apk > SHA256SUMS.txt
          )
          {
            echo "commit=${GITHUB_SHA}"
            echo "package=${EXPECTED_PACKAGE_NAME}"
            echo "versionName=${APP_VERSION_NAME}"
            echo "versionCode=${APP_VERSION_CODE}"
            echo "unsignedApkSha256=${UNSIGNED_APK_SHA256}"
            echo "signedApkSha256=${SIGNED_SHA256}"
            echo "milestone=M7-physical-gate+M8-digital-hardening"
            echo "gate=software+android-integration-passed;physical-validation-pending"
            echo "hardwareBaseline=M6-alpha1-physical-pass"
            echo "certificateSha256=${EXPECTED_CERT_SHA256}"
          } > deliverables/BUILD_IDENTITY.txt

      - name: Upload signed homologation APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GuitarLabStudio-${{ env.APP_VERSION_NAME }}-homologacao
          if-no-files-found: error
          retention-days: 90
          path: deliverables/

      - name: Destroy restored keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/guitarlab-signing"
