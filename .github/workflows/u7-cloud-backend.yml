name: U7 Cloud Backend

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification or controlled cloud stage
        required: true
        default: verify
        type: choice
        options: [verify, shadow, production]
      confirm:
        description: Type DEPLOY for cloud modes
        required: false
        default: ""
        type: string
      production_confirm:
        description: Type PRODUCTION for production cutover
        required: false
        default: ""
        type: string
      run_matrix:
        description: Run the additional CPU4 qualification cell during shadow
        required: false
        default: false
        type: boolean
  push:
    branches: [main, u12-rc19-remote-recovery, u12-rc19-controlled-deploy]

permissions:
  contents: read

concurrency:
  group: guitarlab-u7-cloud-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend source and container
    if: >-
      github.repository_id == '1361533070' &&
      github.repository_owner_id == '216095257' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/u12-rc19-remote-recovery' || github.ref == 'refs/heads/u12-rc19-controlled-deploy') &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run u7 cloud]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact GuitarLab source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/remote-separation/functions/package-lock.json

      - name: Verify immutable repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = "1361533070"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "216095257"
          [[ "$GITHUB_REF" = "refs/heads/main" || "$GITHUB_REF" = "refs/heads/u12-rc19-remote-recovery" || "$GITHUB_REF" = "refs/heads/u12-rc19-controlled-deploy" ]]
          git diff --check

      - name: Test worker and Functions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s cloud/remote-separation/worker/tests -v
          npm ci --prefix cloud/remote-separation/functions
          npm test --prefix cloud/remote-separation/functions

      - name: Validate schemas, scripts and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool cloud/remote-separation/schemas/remote-job.schema.json >/dev/null
          python3 -m json.tool cloud/remote-separation/schemas/result-manifest.schema.json >/dev/null
          python3 - <<'PY'
          import json
          with open("cloud/remote-separation/schemas/remote-job.schema.json", encoding="utf-8") as f:
              job_schema = json.load(f)
          with open("cloud/remote-separation/schemas/result-manifest.schema.json", encoding="utf-8") as f:
              result_schema = json.load(f)
          with open("cloud/remote-separation/firebase.json", encoding="utf-8") as f:
              config = json.load(f)
          with open("cloud/remote-separation/firebase/storage.rules", encoding="utf-8") as f:
              storage_rules = f.read()
          assert job_schema["properties"]["schemaVersion"]["const"] == 2
          assert job_schema["properties"]["resultContract"]["const"] == "prepared-reference-v2"
          assert result_schema["properties"]["schemaVersion"]["const"] == 2
          assert result_schema["properties"]["referenceRecipe"]["$ref"] == "#/$defs/referenceRecipe"
          providers = config.get("auth", {}).get("providers", {})
          assert providers.get("emailPassword") is True, "Firebase email/password auth must be declared enabled"
          assert providers.get("anonymous") is False, "Firebase anonymous auth must be declared disabled"
          prepared_match = "match /remote/v1/users/{uid}/jobs/{jobId}/output/prepared/{fileName}"
          prepared_allow = "allow read: if mine(uid) && fileName.matches('^(backing|guitar)\\\\.wav$');"
          assert prepared_match in storage_rules, "prepared-reference v2 download path must be authorized"
          assert prepared_allow in storage_rules, "only backing/guitar v2 artifacts may be downloaded"
          assert "match /remote/v1/users/{uid}/jobs/{jobId}/output/{path=**}" not in storage_rules, \
              "recursive output grants would expose unintended remote artifacts"
          PY
          grep -q '"schemaVersion": 2' cloud/remote-separation/worker/gbw_worker.py
          grep -q 'purgeStaleRemoteArtifacts' cloud/remote-separation/functions/src/index.ts
          grep -q 'roles/cloudscheduler.admin' cloud/remote-separation/scripts/bootstrap-github-actions.sh
          grep -q 'roles/storage.admin' cloud/remote-separation/scripts/bootstrap-github-actions.sh
          grep -q 'remote_storage_lifecycle=PASS age_days=3 prefix=remote/v1/users/' cloud/remote-separation/scripts/ensure-remote-storage-lifecycle.sh
          grep -q 'remote_prefix = "remote/v1/users/"' cloud/remote-separation/scripts/ensure-remote-storage-lifecycle.sh
          grep -q 'roles/firebaseauth.admin' cloud/remote-separation/scripts/bootstrap-github-actions.sh
          grep -q 'roles/iam.serviceAccountTokenCreator' scripts/bootstrap_u4_github_wif.sh
          grep -q 'updateMask=signIn.email.enabled,signIn.email.passwordRequired,signIn.anonymous.enabled' cloud/remote-separation/scripts/ensure-email-password-auth.sh
          grep -q 'allowlisted_password_users=PASS' cloud/remote-separation/scripts/verify-allowlisted-auth-users.sh
          grep -q 'Anonymous Firebase Authentication is intentionally disabled' cloud/remote-separation/scripts/ensure-anonymous-auth.sh
          find cloud/remote-separation scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile scripts/u12_rc20_local_parity.py
          python3 scripts/u12_generate_benchmark_fixture.py /tmp/u12-w4-fixture.wav --seconds 1
          python3 - <<'PY'
          import wave
          with wave.open("/tmp/u12-w4-fixture.wav", "rb") as wav:
              assert wav.getframerate() == 44100
              assert wav.getnchannels() == 2
              assert wav.getsampwidth() == 2
              assert wav.getnframes() == 44100
          PY
          ! grep -RIE --exclude-dir=node_modules --exclude-dir=lib '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:|AIza[0-9A-Za-z_-]{30,})' cloud/remote-separation .github/workflows/u7-cloud-backend.yml

      - name: Build worker container without publishing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker build --pull --tag "guitarlab-u7-worker:${GITHUB_SHA}" cloud/remote-separation/worker; then
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "::error::Worker container build failed after 4 attempts." >&2
              exit 1
            fi
            echo "::warning::Worker container build attempt $attempt failed; retrying external dependency fetch."
            sleep $((attempt * 15))
          done

  auth_config:
    name: Enforce and verify Firebase email/password authentication
    if: >-
      github.repository_id == '1361533070' &&
      github.repository_owner_id == '216095257' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[run u7 cloud]')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GBW_GCP_PROJECT: gbwapp-ef048
      GBW_ALLOWED_UIDS: ${{ secrets.GBW_ALLOWED_UIDS }}
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate keylessly to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/119299736855/locations/global/workloadIdentityPools/github-gbw/providers/github-actions
          service_account: gbw-github-deployer@gbwapp-ef048.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '585.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/remote-separation/functions/package-lock.json

      - name: Enforce Firebase email/password Authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GBW_ALLOWED_UIDS"
          bash cloud/remote-separation/scripts/ensure-email-password-auth.sh u7-auth-config.json | tee u7-auth-admin-evidence.txt

      - name: Install Firebase Admin dependencies
        run: npm ci --prefix cloud/remote-separation/functions

      - name: Verify allowlisted password-backed Firebase users
        shell: bash
        run: |
          set -euo pipefail
          bash cloud/remote-separation/scripts/verify-allowlisted-auth-users.sh u7-auth-user-evidence.txt

      - name: Bind evidence to exact source
        shell: bash
        run: |
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> u7-auth-admin-evidence.txt
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> u7-auth-user-evidence.txt

      - name: Upload Authentication evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: u7-email-auth-verification-${{ github.sha }}
          path: |
            u7-auth-config.json
            u7-auth-admin-evidence.txt
            u7-auth-user-evidence.txt
          if-no-files-found: error

  deploy:
    name: Controlled shadow or production deploy
    needs: verify
    if: >-
      github.repository_id == '1361533070' &&
      github.repository_owner_id == '216095257' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'shadow' || inputs.mode == 'production') &&
          inputs.confirm == 'DEPLOY' &&
          (inputs.mode != 'production' || inputs.production_confirm == 'PRODUCTION')
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (
            contains(github.event.head_commit.message, '[run u7 shadow]') ||
            (
              contains(github.event.head_commit.message, '[run u7 production]') &&
              contains(github.event.head_commit.message, '[confirm production]')
            )
          )
        )
      )
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GBW_GCP_PROJECT: gbwapp-ef048
      GBW_BUCKET: gbwapp-ef048.firebasestorage.app
      GBW_REGION: us-central1
      GBW_ALLOWED_UIDS: ${{ secrets.GBW_ALLOWED_UIDS }}
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve controlled deploy mode
        id: deploy_mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.head_commit.message }}" == *"[run u7 shadow]"* ]]; then
            mode="shadow"
          elif [[ "${{ github.event.head_commit.message }}" == *"[run u7 production]"* ]] &&
               [[ "${{ github.event.head_commit.message }}" == *"[confirm production]"* ]]; then
            mode="production"
          else
            echo "::error::No controlled deploy mode was authorized." >&2
            exit 1
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Initialize deploy evidence
        shell: bash
        run: printf 'source_sha=%s\nmode=%s\n' "$GITHUB_SHA" "${{ steps.deploy_mode.outputs.mode }}" > u7-deploy-evidence.txt

      - name: Authenticate keylessly to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/119299736855/locations/global/workloadIdentityPools/github-gbw/providers/github-actions
          service_account: gbw-github-deployer@gbwapp-ef048.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '585.0.0'
          install_components: 'beta'

      - name: Set up Node.js for production Functions and U4 smoke
        if: steps.deploy_mode.outputs.mode == 'production'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/remote-separation/functions/package-lock.json

      - name: Install Firebase Admin dependencies for production U4 smoke
        if: steps.deploy_mode.outputs.mode == 'production'
        run: npm ci --prefix cloud/remote-separation/functions

      - name: Install pinned Firebase CLI for production
        if: steps.deploy_mode.outputs.mode == 'production'
        run: npm install --global firebase-tools@15.30.2

      - name: Validate deployment inputs before mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.deploy_mode.outputs.mode }}" == production ]]; then
            test -n "$GBW_ALLOWED_UIDS" || {
              echo "::error::Repository secret GBW_ALLOWED_UIDS is required for production." >&2
              exit 1
            }
          fi

      - name: Capture last-known-good production identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$GBW_GCP_PROJECT" >/dev/null
          previous="$(gcloud run jobs describe gbw-demucs --region "$GBW_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "$previous"
          printf 'previous_production_image=%s\n' "$previous" | tee -a u7-deploy-evidence.txt
          echo "PREVIOUS_PRODUCTION_IMAGE=$previous" >> "$GITHUB_ENV"

      - name: Deploy digest-pinned worker
        id: worker
        shell: bash
        env:
          GBW_JOB_NAME: ${{ steps.deploy_mode.outputs.mode == 'shadow' && 'guitarlab-demucs-shadow' || 'gbw-demucs' }}
        run: |
          set -euo pipefail
          pinned="$(bash cloud/remote-separation/scripts/deploy-worker.sh | tail -1)"
          case "$pinned" in *@sha256:*) ;; *) echo "Worker image is not digest-pinned" >&2; exit 1;; esac
          echo "pinned_image=$pinned" >> "$GITHUB_OUTPUT"
          echo "deployed_image=$pinned" >> u7-deploy-evidence.txt

      - name: Capture RC20 resolved dependency closure
        if: steps.deploy_mode.outputs.mode == 'shadow'
        shell: bash
        env:
          GBW_PINNED_IMAGE: ${{ steps.worker.outputs.pinned_image }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/u12-rc20-supply-chain
          docker run --rm --entrypoint cat "$GBW_PINNED_IMAGE" /opt/rc20/python-resolved.txt \
            > artifacts/u12-rc20-supply-chain/python-resolved.txt
          printf 'source_sha=%s\nimage=%s\ntrivy_action_commit=%s\n' \
            "$GITHUB_SHA" "$GBW_PINNED_IMAGE" "ed142fd0673e97e23eac54620cfb913e5ce36c25" \
            > artifacts/u12-rc20-supply-chain/identity.txt

      - name: Generate RC20 CycloneDX SBOM
        if: steps.deploy_mode.outputs.mode == 'shadow'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.worker.outputs.pinned_image }}
          format: cyclonedx
          output: artifacts/u12-rc20-supply-chain/sbom.cdx.json
          scanners: vuln
          list-all-pkgs: true
          timeout: 15m

      - name: Scan RC20 high and critical vulnerabilities
        if: steps.deploy_mode.outputs.mode == 'shadow'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.worker.outputs.pinned_image }}
          format: json
          output: artifacts/u12-rc20-supply-chain/vulnerabilities.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 15m

      - name: Enforce RC20 critical-vulnerability gate
        if: steps.deploy_mode.outputs.mode == 'shadow'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path("artifacts/u12-rc20-supply-chain/vulnerabilities.json")
          data = json.loads(src.read_text(encoding="utf-8"))
          vulnerabilities = [
              vulnerability
              for result in data.get("Results", [])
              for vulnerability in (result.get("Vulnerabilities") or [])
          ]
          high = [v for v in vulnerabilities if v.get("Severity") == "HIGH"]
          critical = [v for v in vulnerabilities if v.get("Severity") == "CRITICAL"]
          # Debian ships zlib without the unsupported contrib/minizip code affected by
          # CVE-2023-45853. Trivy inherits NVD's CRITICAL score even though Debian marks
          # the package finding will_not_fix and publishes no fixed version. Keep this
          # exception deliberately narrow so any package/status/fix change fails closed.
          def accepted_critical_reason(vulnerability):
              if (
                  vulnerability.get("VulnerabilityID") == "CVE-2023-45853"
                  and vulnerability.get("PkgName") == "zlib1g"
                  and vulnerability.get("Status") == "will_not_fix"
                  and not vulnerability.get("FixedVersion")
              ):
                  return "Debian zlib1g does not ship the unsupported contrib/minizip code"
              vendor_severity = vulnerability.get("VendorSeverity") or {}
              if (
                  vulnerability.get("VulnerabilityID") == "CVE-2026-6653"
                  and vulnerability.get("PkgName") == "libxml2"
                  and vulnerability.get("Status") == "affected"
                  and not vulnerability.get("FixedVersion")
                  and vulnerability.get("SeveritySource") == "nvd"
                  and vendor_severity.get("redhat") == 2
                  and vendor_severity.get("ubuntu") == 2
              ):
                  return "NVD scores CRITICAL; Red Hat and Ubuntu score the Linux finding MEDIUM"
              return None

          accepted_critical = [v for v in critical if accepted_critical_reason(v)]
          blocking_critical = [v for v in critical if v not in accepted_critical]
          summary = {
              "high": len(high),
              "critical": len(critical),
              "criticalIds": sorted({str(v.get("VulnerabilityID")) for v in critical}),
              "acceptedCritical": [
                  {
                      "id": str(v.get("VulnerabilityID")),
                      "package": str(v.get("PkgName")),
                      "installedVersion": str(v.get("InstalledVersion")),
                      "status": str(v.get("Status")),
                      "reason": accepted_critical_reason(v),
                  }
                  for v in accepted_critical
              ],
              "blockingCritical": len(blocking_critical),
              "blockingCriticalIds": sorted({
                  str(v.get("VulnerabilityID")) for v in blocking_critical
              }),
          }
          Path("artifacts/u12-rc20-supply-chain/vulnerability-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          if blocking_critical:
              raise SystemExit("RC20 worker image contains blocking CRITICAL vulnerabilities")
          PY

      - name: Upload RC20 supply-chain evidence
        if: always() && steps.deploy_mode.outputs.mode == 'shadow' && steps.worker.outcome == 'success'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: u12-rc20-supply-chain-${{ github.sha }}
          path: artifacts/u12-rc20-supply-chain/
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy production rules and Functions
        if: steps.deploy_mode.outputs.mode == 'production'
        run: bash cloud/remote-separation/scripts/deploy-functions.sh

      - name: Verify deployed runtime contract
        shell: bash
        env:
          GBW_JOB_NAME: ${{ steps.deploy_mode.outputs.mode == 'shadow' && 'guitarlab-demucs-shadow' || 'gbw-demucs' }}
          EXPECTED_IMAGE: ${{ steps.worker.outputs.pinned_image }}
        run: |
          set -euo pipefail
          actual="$(gcloud run jobs describe "$GBW_JOB_NAME" --region "$GBW_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test "$actual" = "$EXPECTED_IMAGE"
          job_json="$(gcloud run jobs describe "$GBW_JOB_NAME" --region "$GBW_REGION" --format=json)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); t=d["spec"]["template"]["spec"]; i=t["template"]["spec"]; assert int(t["taskCount"])==1; assert int(t["parallelism"])==1; assert int(i["maxRetries"])==0; assert int(str(i["timeoutSeconds"]).removesuffix("s"))==1800' <<<"$job_json"
          echo "runtime_contract=PASS" >> u7-deploy-evidence.txt

      - name: Exercise full U4 prepared-reference v2 contract after production cutover
        if: steps.deploy_mode.outputs.mode == 'production'
        shell: bash
        env:
          GBW_JOB_NAME: ${{ steps.deploy_mode.outputs.mode == 'shadow' && 'guitarlab-demucs-shadow' || 'gbw-demucs' }}
          MODEL_SHA256: 34c22ccb381c6f9fdbf324f04e1e2fe21aaaf293f5ded163a162697ff9a02ddd
          GBW_RECOVERY_GATE_REQUIRED: ${{ steps.deploy_mode.outputs.mode == 'production' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash scripts/u4_cloud_integration_smoke.sh | tee -a u7-deploy-evidence.txt

      - name: Run consolidated W3/W4 shadow qualification
        id: w3_w4_baseline
        if: steps.deploy_mode.outputs.mode == 'shadow'
        shell: bash
        env:
          GBW_PINNED_IMAGE: ${{ steps.worker.outputs.pinned_image }}
          GBW_W4_VARIANT: cpu8-baseline
          GBW_W4_STRATEGY: cpu8_s1_o05
          GBW_W4_VCPU: '8'
          GBW_W4_MEMORY_GIB: '16'
          GBW_W4_MEMORY_RESOURCE: 16Gi
          GBW_W4_WARM_PROBE: '1'
          # Full benchmark validates assets/model load; separate Cloud Run model-probe is redundant.
          GBW_W4_MODEL_PROBE: '0'
        run: |
          set -euo pipefail
          bash scripts/u12_rc20_shadow_benchmark.sh | tee -a u7-deploy-evidence.txt

      - name: Run W4 CPU4 matrix cell
        id: w4_cpu4
        if: >-
          steps.deploy_mode.outputs.mode == 'shadow' &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.run_matrix == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[run u7 matrix]'))
          )
        shell: bash
        env:
          GBW_PINNED_IMAGE: ${{ steps.worker.outputs.pinned_image }}
          GBW_W4_VARIANT: cpu4-matrix
          GBW_W4_STRATEGY: cpu4_s1_o05
          GBW_W4_VCPU: '4'
          GBW_W4_MEMORY_GIB: '16'
          GBW_W4_MEMORY_RESOURCE: 16Gi
          GBW_W4_WARM_PROBE: '1'
          GBW_W4_MODEL_PROBE: '0'
        run: |
          set -euo pipefail
          bash scripts/u12_rc20_shadow_benchmark.sh | tee -a u7-deploy-evidence.txt

      - name: Upload consolidated W3/W4 qualification bundle
        if: always() && steps.deploy_mode.outputs.mode == 'shadow' && steps.worker.outcome == 'success'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: u12-rc20-w3-w4-shadow-${{ github.sha }}
          path: artifacts/u12-rc20-w4/
          if-no-files-found: warn
          retention-days: 14

      - name: Restore prior production image after failed cutover
        if: failure() && steps.deploy_mode.outputs.mode == 'production' && env.PREVIOUS_PRODUCTION_IMAGE != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update gbw-demucs --region "$GBW_REGION" --image "$PREVIOUS_PRODUCTION_IMAGE" --quiet
          restored="$(gcloud run jobs describe gbw-demucs --region "$GBW_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test "$restored" = "$PREVIOUS_PRODUCTION_IMAGE"
          echo "automatic_rollback=PASS" >> u7-deploy-evidence.txt

      - name: Upload deploy identity and rollback evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: u7-cloud-deploy-${{ github.sha }}-${{ steps.deploy_mode.outputs.mode }}
          path: u7-deploy-evidence.txt
          if-no-files-found: error

