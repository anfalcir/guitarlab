name: RC20 W5 Owner Listening

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: guitarlab-rc20-w5
  cancel-in-progress: false

jobs:
  w5:
    name: Generate exact-digest musical listening bundle
    if: >-
      github.repository_id == '1361533070' &&
      github.repository_owner_id == '216095257' &&
      contains(github.event.head_commit.message, '[run w5]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GBW_GCP_PROJECT: gbwapp-ef048
      GBW_BUCKET: gbwapp-ef048.firebasestorage.app
      GBW_REGION: us-central1
      GBW_PINNED_IMAGE: us-central1-docker.pkg.dev/gbwapp-ef048/gbw/remote-worker@sha256:6a6d5017e0e2c9bf3800bca3a3c3988ed9398add4ef2c3097241a7a260893dbe
      GBW_W5_SOURCE_FILE: temporario/mmf-misery-85cdef6e6bd5671e320fc503db582f23eecd1a75097c5cc2b5994f8e693d9ec2.m4a
      GBW_W5_SOURCE_SHA256: 85cdef6e6bd5671e320fc503db582f23eecd1a75097c5cc2b5994f8e693d9ec2
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify private musical fixture identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GBW_W5_SOURCE_FILE"
          test "$(sha256sum "$GBW_W5_SOURCE_FILE" | awk '{print $1}')" = "$GBW_W5_SOURCE_SHA256"

      - name: Authenticate keylessly to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/119299736855/locations/global/workloadIdentityPools/github-gbw/providers/github-actions
          service_account: gbw-github-deployer@gbwapp-ef048.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '585.0.0'

      - name: Generate W5 musical listening bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/u12_rc20_w5_listening.sh

      - name: Upload W5 listening bundle
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: u12-rc20-w5-listening-${{ github.sha }}
          path: artifacts/u12-rc20-w5/
          if-no-files-found: error
          retention-days: 14
