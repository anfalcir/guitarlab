name: U12 Runtime Maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-runtime:
    if: ${{ contains(github.event.head_commit.message, '[run u12 runtime maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Patch runtime without exposing existing Firebase configuration
        shell: python
        run: |
          from pathlib import Path
          path = Path("platform/separation/src/main/kotlin/studio/guitarlab/platform/separation/FirebaseRemoteRuntime.kt")
          text = path.read_text()

          manifest_old = '            storage.reference.child(prefix(identity) + "/result-manifest.json").getBytes(65536).await()'
          manifest_new = '''            staging.cachedManifest(identity)?.let { return@staged it }
                      val bytes = storage.reference.child(prefix(identity) + "/result-manifest.json").getBytes(65536).await()
                      staging.commitManifest(identity, bytes)'''
          if text.count(manifest_old) != 1:
              raise SystemExit("manifest cache anchor mismatch")
          text = text.replace(manifest_old, manifest_new)

          cleanup_start = text.find("    override suspend fun cleanup(identity: RemoteJobIdentity) {")
          cleanup_end = text.find("\n    private suspend fun prefix(identity: RemoteJobIdentity)", cleanup_start)
          if cleanup_start < 0 or cleanup_end < 0:
              raise SystemExit("cleanup anchor mismatch")
          cleanup_new = '''    override suspend fun cleanup(identity: RemoteJobIdentity) {
                  // Remote object ownership belongs to acknowledgeRemoteImport/cancel/janitor.
                  // Client cleanup is deliberately local-only so backend purge failures remain observable.
                  staging.clear(identity)
              }
          '''
          text = text[:cleanup_start] + cleanup_new + text[cleanup_end:]

          coordinator_old = '''            ),
                  )
                  val previousRetryCode = store.load(id.jobId)?.errorCode'''
          coordinator_new = '''            ),
                      expectedResultUid = { requireStableRemoteUid(auth) },
                  )
                  val previousRetryCode = store.load(id.jobId)?.errorCode'''
          if text.count(coordinator_old) != 1:
              raise SystemExit("coordinator uid anchor mismatch")
          text = text.replace(coordinator_old, coordinator_new)
          path.write_text(text)

      - name: Commit exact runtime patch and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/u12-runtime-maintenance.yml
          git add platform/separation/src/main/kotlin/studio/guitarlab/platform/separation/FirebaseRemoteRuntime.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "u12ab: wire manifest cache and backend-owned purge [skip ci]"
          git push origin HEAD:main
