name: Apply M5 Media IO

on:
  push:
    branches:
      - dev/parallel-m3-m5
    paths:
      - '.github/workflows/apply-m5-media-io.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reassemble reviewed media I/O payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/m5-media-io.chunks/* > "$RUNNER_TEMP/m5-media-files.b64"
          base64 -d "$RUNNER_TEMP/m5-media-files.b64" > "$RUNNER_TEMP/m5-media-files.tar.gz"
          echo "8d0624dffd4d98e9f9e60c774c4bfb36cf77d7c25fd023f3a1e49b2afdb962b0  $RUNNER_TEMP/m5-media-files.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/m5-media-files.tar.gz" -C .
          rm -rf .github/patches/m5-media-io.chunks
          rm -f .github/patches/m5-media-io.patch.gz
          rm -f .github/workflows/apply-m5-media-io.yml
          rm -f .github/workflows/source-snapshot.yml
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GuitarLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement definitive M5 media I/O foundation"
          git push origin HEAD:dev/parallel-m3-m5
