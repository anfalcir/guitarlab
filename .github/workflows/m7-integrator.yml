name: GuitarLab M7 Integrator

on:
  push:
    branches: [ dev/parallel-m3-m5 ]
    paths:
      - '.github/m7-trigger.txt'

permissions:
  contents: write

jobs:
  integrate-m7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Harden integrator anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/m7_integrate.py')
          t = p.read_text()
          diag_old = 'raise SystemExit(f"{path}: anchor not found enough times ({found} < {count})")'
          diag_new = 'raise SystemExit(f"{path}: anchor not found enough times ({found} < {count}); anchor={old[:180]!r}")'
          if diag_old in t:
              t = t.replace(diag_old, diag_new, 1)
          start = "replace(p, '''                            sourceSampleRateHz = metadata.sampleRateHz,"
          end = "''')\n# Import status should report"
          a = t.find(start)
          b = t.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('StudioViewModel source metadata replacement block not found')
          corrected = '''replace(p, '''\"\"\"                            sourceTotalFrames = metadata.totalFrames,
                            sourceFormat = originalFormat.displayName,
                            sourceSampleRateHz = metadata.sampleRateHz,
                            sourceChannelCount = metadata.channelCount,
                            sourceBitsPerSample = sourceBits,
                            sourceEncoding = sourceEncoding,
\"\"\"''', '''\"\"\"                            sourceTotalFrames = sourceMetadata.totalFrames,
                            sourceFormat = originalFormat.displayName,
                            sourceSampleRateHz = sourceMetadata.sampleRateHz,
                            sourceChannelCount = sourceMetadata.channelCount,
                            sourceBitsPerSample = sourceBits,
                            sourceEncoding = sourceEncoding,
                            editingSampleRateHz = metadata.sampleRateHz,
                            editingTotalFrames = metadata.totalFrames,
\"\"\"''')
'''
          # turn escaped triple markers back into the integrator's native triple-single-quoted literals
          corrected = corrected.replace("'''\\\"\\\"\\\"", "'''").replace("\\\"\\\"\\\"'''", "'''")
          t = t[:a] + corrected + t[b+4:]
          p.write_text(t)
          PY

      - name: Integrate M7 sources
        shell: bash
        run: python3 tools/m7_integrate.py

      - name: Diff sanity
        shell: bash
        run: git diff --check

      - name: Unit tests
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace test

      - name: Android Lint
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace lint

      - name: Assemble debug APK
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace assembleDebug

      - name: Commit validated M7 source
        shell: bash
        run: |
          git config user.name "GuitarLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app core platform docs
          git diff --cached --check
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "feat: implement M7 production audio polish"
          git push origin HEAD:dev/parallel-m3-m5
