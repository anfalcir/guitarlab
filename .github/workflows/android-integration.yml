name: GuitarLab Android Integration Gate

on:
  push:
    branches: [ dev/parallel-m3-m5 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guitarlab-android-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  android-integration-gate:
    name: API 36 emulator regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Diff sanity
        shell: bash
        run: git diff --check HEAD^ --

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.6.1 and persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 36 instrumented regression
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle --no-daemon --console=plain --stacktrace connectedDebugAndroidTest

      - name: Upload Android integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-${{ github.sha }}-android-integration
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
