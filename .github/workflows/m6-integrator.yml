name: GuitarLab M6 Integrator

on:
  push:
    branches: [ dev/parallel-m3-m5 ]
    paths:
      - '.github/m6-trigger.txt'

permissions:
  contents: write

jobs:
  integrate-m6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Harden calibration permission guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/m6_integrate.py')
          text = p.read_text()
          old = '    private fun measurePass(sampleRateHz: Int, inputDevice: AudioDeviceInfo?, outputDevice: AudioDeviceInfo?): Pair<Long, Float> {\\n        val template = stimulus(STIMULUS_FRAMES)'
          new = '    private fun measurePass(sampleRateHz: Int, inputDevice: AudioDeviceInfo?, outputDevice: AudioDeviceInfo?): Pair<Long, Float> {\\n        if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\\n            throw SecurityException(\\"Permissão de microfone necessária para medir a latência.\\")\\n        }\\n        val template = stimulus(STIMULUS_FRAMES)'
          if old not in text:
              raise SystemExit('permission guard anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Integrate and validate M6
        shell: bash
        run: python3 tools/m6_integrate.py
