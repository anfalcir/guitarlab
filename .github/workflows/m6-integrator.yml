name: GuitarLab M6 Integrator

on:
  push:
    branches: [ dev/parallel-m3-m5 ]
    paths:
      - '.github/m6-trigger.txt'

permissions:
  contents: write

jobs:
  integrate-m6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Materialize split source
        shell: bash
        run: |
          chmod +x scripts/materialize_ci_sources.sh
          scripts/materialize_ci_sources.sh

      - name: Harden and constrain M6 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/m6_integrate.py')
          text = p.read_text()

          old = '    private fun measurePass(sampleRateHz: Int, inputDevice: AudioDeviceInfo?, outputDevice: AudioDeviceInfo?): Pair<Long, Float> {\\n        val template = stimulus(STIMULUS_FRAMES)'
          new = '    private fun measurePass(sampleRateHz: Int, inputDevice: AudioDeviceInfo?, outputDevice: AudioDeviceInfo?): Pair<Long, Float> {\\n        if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\\n            throw SecurityException(\\"Permissão de microfone necessária para medir a latência.\\")\\n        }\\n        val template = stimulus(STIMULUS_FRAMES)'
          if old not in text:
              raise SystemExit('permission guard anchor not found')
          text = text.replace(old, new, 1)

          # The GitHub Actions token cannot mutate workflow files. Keep workflow identity
          # changes for the connector-controlled final promotion commit instead.
          text = '\n'.join(
              line for line in text.splitlines()
              if not line.startswith('replace_once(".github/workflows/android-ci.yml"')
          ) + '\n'
          old_cleanup = 'for relative in ["tools/m6_integrate.py", ".github/workflows/m6-integrator.yml", ".github/m6-trigger.txt"]:'
          new_cleanup = 'for relative in ["tools/m6_integrate.py", ".github/m6-trigger.txt"]:'
          if old_cleanup not in text:
              raise SystemExit('cleanup anchor not found')
          text = text.replace(old_cleanup, new_cleanup, 1)

          # Automatic routes are intentionally not considered stable calibration identities.
          old_find = '    fun find(inputSignature: String?, outputSignature: String?, sampleRateHz: Int): LatencyCalibration? {\\n        val key = key(inputSignature, outputSignature, sampleRateHz)'
          new_find = '    fun find(inputSignature: String?, outputSignature: String?, sampleRateHz: Int): LatencyCalibration? {\\n        if (inputSignature.isNullOrBlank() || outputSignature.isNullOrBlank()) return null\\n        val key = key(inputSignature, outputSignature, sampleRateHz)'
          if old_find not in text:
              raise SystemExit('calibration find anchor not found')
          text = text.replace(old_find, new_find, 1)

          old_save = '    fun save(inputSignature: String?, outputSignature: String?, calibration: LatencyCalibration) {\\n        val key = key(inputSignature, outputSignature, calibration.sampleRateHz)'
          new_save = '    fun save(inputSignature: String?, outputSignature: String?, calibration: LatencyCalibration) {\\n        if (inputSignature.isNullOrBlank() || outputSignature.isNullOrBlank()) return\\n        val key = key(inputSignature, outputSignature, calibration.sampleRateHz)'
          if old_save not in text:
              raise SystemExit('calibration save anchor not found')
          text = text.replace(old_save, new_save, 1)

          old_run = '    fun runLatencyCalibration() {\\n        if (calibrating) return\\n        calibrating = true'
          new_run = '    fun runLatencyCalibration() {\\n        if (calibrating) return\\n        if (selectedInput.isNullOrBlank() || selectedOutput.isNullOrBlank()) {\\n            calibrationStatus = \\"Selecione explicitamente a entrada e a saída antes de calibrar.\\"\\n            return\\n        }\\n        calibrating = true'
          if old_run not in text:
              raise SystemExit('calibration explicit-route anchor not found')
          text = text.replace(old_run, new_run, 1)

          p.write_text(text)
          PY

      - name: Integrate and validate M6
        shell: bash
        run: python3 tools/m6_integrate.py
