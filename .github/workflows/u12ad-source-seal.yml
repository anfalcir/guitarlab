name: U12ad Source Seal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seal:
    if: ${{ contains(github.event.head_commit.message, '[run u12ad seal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and verify canonical U12ad source seal
        run: python3 scripts/generate_u12ad_source_seal.py

      - name: Commit source seal
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/u12ad-source-seal.yml scripts/generate_u12ad_source_seal.py
          git add .source-parts/U12adPublisherFixtureCorrective.patch.b64 \
            scripts/materialize_ci_sources_u12ad.py \
            scripts/materialize_ci_sources.sh
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "u12ad: seal publisher fixture corrective [skip ci]"
          git push origin HEAD:main
